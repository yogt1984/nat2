[project]
name = "nat2"
version = "0.1.0"
description = "Terminal research and execution engine for Hyperliquid"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "zstandard>=0.23",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nat2 = "nat2.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nat2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
